<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Constancia Digital de Infracción con Código QR - MPCH"
    />
    <meta name="theme-color" content="#1E8449" />
    <title>MPCH - Constancia de Acta Digital (RN-09 y RN-10)</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="mobile-frame">
      <div
        class="toast-alerta-conexion toast-info"
        id="toastAcuse"
        role="status"
        aria-live="polite"
      >
        <span aria-hidden="true">✓</span>
        <span id="toastAcuseMsg"
          >Acuse registrado en cola de notificaciones.</span
        >
      </div>

      <header
        class="header"
        style="
          background-color: #1e8449;
          text-align: center;
          align-items: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: #ffffff;
            color: #1e8449;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
          "
          aria-hidden="true"
        >
          ✓
        </div>
        <h1 class="login-title">Acta de Infracción Emitida</h1>
        <p style="font-size: 12px; color: #ffffff; font-weight: 600">
          Documento registrado con firma digital inmutable
        </p>
      </header>

      <main class="content">
        <article class="result-card" data-testid="acta-emitida-card">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              border-bottom: 1px solid #cbd5e1;
              padding-bottom: 8px;
              gap: 8px;
            "
          >
            <span
              style="font-size: 13.5px; font-weight: 900; color: #c0392b"
              id="lblCorrelativo"
              data-testid="acta-correlativo"
            >
              ---
            </span>
            <span
              style="font-size: 11px; color: #475569; font-weight: 700"
              id="lblFecha"
            >
              --/--/----
            </span>
          </div>

          <div class="result-body">
            <div class="summary-row">
              <span class="summary-label">Vehículo Intervenido</span>
              <span
                class="summary-value"
                id="lblVehiculo"
                data-testid="acta-vehiculo"
                >---</span
              >
            </div>
            <div class="summary-row">
              <span class="summary-label">Infractor / Titular</span>
              <span class="summary-value" id="lblTitular">---</span>
            </div>
            <div class="summary-row">
              <span class="summary-label">Tipificación</span>
              <span
                class="summary-value"
                id="lblInfraccion"
                style="color: #c0392b"
                >---</span
              >
            </div>
            <div class="summary-row">
              <span class="summary-label">Inspector</span>
              <span class="summary-value" id="lblInspector">---</span>
            </div>
            <div class="summary-row">
              <span class="summary-label">Lugar</span>
              <span class="summary-value" id="lblLugar">---</span>
            </div>
          </div>

          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              padding: 12px;
              background: #f8fafc;
              border-radius: 12px;
              border: 1.5px dashed #64748b;
              gap: 8px;
            "
          >
            <canvas
              class="qr-code"
              id="qrCanvas"
              data-testid="qr-acta"
              width="148"
              height="148"
              aria-label="Código QR de verificación del Acta Digital"
            ></canvas>
            <span
              style="
                font-size: 11px;
                color: #475569;
                font-weight: 700;
                text-align: center;
              "
            >
              Código QR verificable — Portal MPCH Chachapoyas
            </span>
          </div>

          <div
            id="lblHash"
            style="
              font-family: monospace;
              font-size: 10px;
              color: #0f172a;
              background: #f1f5f9;
              padding: 8px;
              border-radius: 6px;
              word-break: break-all;
              text-align: center;
              border: 1px solid #cbd5e1;
            "
          >
            ---
          </div>
        </article>
      </main>

      <footer class="footer-actions">
        <button
          class="btn-action btn-primary"
          id="btnImprimirPdf"
          data-testid="btn-imprimir-pdf"
          type="button"
        >
          📄 DESCARGAR / IMPRIMIR PDF
        </button>
        <button
          class="btn-action btn-outline"
          id="btnEnviarAcuse"
          data-testid="btn-enviar-acuse"
          type="button"
        >
          ✉️ REGISTRAR ACUSE DIGITAL
        </button>
        <button
          class="btn-action btn-secondary"
          id="btnNuevaFiscalizacion"
          data-testid="btn-nueva-fiscalizacion"
          type="button"
        >
          NUEVA FISCALIZACIÓN
        </button>
      </footer>
    </div>

    <script type="module">
      import { inicializarGuardiaSesion } from "/js/session-guard.js";
      import { getSupabaseClient } from "/js/supabase-client.js";

      inicializarGuardiaSesion([
        "INSPECTOR_CAMPO",
        "ESPECIALISTA_OPERATIVO",
        "ADMIN",
      ]);

      let acta = JSON.parse(
        sessionStorage.getItem("mpch_acta_emitida") || "null",
      );
      const params = new URLSearchParams(window.location.search);
      const correlativoParam = params.get("correlativo");

      if (!acta && correlativoParam) {
        try {
          const sb = await getSupabaseClient();
          if (sb) {
            const { data } = await sb
              .from("actas_fiscalizacion")
              .select("*")
              .eq("correlativo", correlativoParam)
              .maybeSingle();
            if (data) acta = data;
          }
        } catch {
          // Continuar con redirección segura si no existe acta
        }
      }

      if (!acta || !acta.correlativo) {
        window.location.replace("/consulta-campo");
      }

      document.getElementById("lblCorrelativo").textContent =
        `ACTA N.° ${acta.correlativo}`;
      document.getElementById("lblFecha").textContent = new Date(
        acta.emitido_en || Date.now(),
      ).toLocaleString("es-PE");
      document.getElementById("lblVehiculo").textContent =
        `${acta.placa_mostrada} (${acta.vehiculo_desc})`;
      document.getElementById("lblTitular").textContent =
        `${acta.titular_nombre} (DNI: ${acta.titular_dni})`;
      document.getElementById("lblInfraccion").textContent =
        `Cód. ${acta.infraccion_codigo} — ${acta.infraccion_descripcion}`;
      document.getElementById("lblInspector").textContent =
        `${acta.inspector_nombre} (${acta.inspector_codigo})`;
      document.getElementById("lblLugar").textContent = acta.lugar_intervencion;
      document.getElementById("lblHash").textContent =
        `Firma: ${acta.hash_firma}`;

      // Generar código QR real escaneable mediante CDN ligero
      const qrCanvas = document.getElementById("qrCanvas");
      const payloadQr = JSON.stringify({
        entidad: "MPCH",
        acta: acta.correlativo,
        placa: acta.placa_mostrada,
        hash: acta.hash_firma,
      });

      try {
        const QRCode = (
          await import("https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm")
        ).default;
        await QRCode.toCanvas(qrCanvas, payloadQr, { width: 148, margin: 1 });
      } catch {
        // Fallback visual determinístico si no hay red para el módulo CDN
        const ctx = qrCanvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, 148, 148);
        ctx.fillStyle = "#0F172A";
        ctx.font = "bold 12px monospace";
        ctx.fillText(acta.correlativo, 12, 70);
        ctx.fillText(acta.placa_mostrada, 34, 90);
      }

      document
        .getElementById("btnImprimirPdf")
        .addEventListener("click", () => {
          window.print();
        });

      document
        .getElementById("btnEnviarAcuse")
        .addEventListener("click", async () => {
          const toast = document.getElementById("toastAcuse");
          const toastMsg = document.getElementById("toastAcuseMsg");
          try {
            const sb = await getSupabaseClient();
            if (sb) {
              await sb.from("notificaciones_cola").insert({
                expediente_codigo: acta.correlativo,
                destinatario_email: "notificaciones.campo@mpch.gob.pe",
                asunto: `Acuse Acta Digital ${acta.correlativo} (${acta.placa_mostrada})`,
                cuerpo: `Se adjunta constancia SHA-256 ${acta.hash_firma}`,
                estado: "ENVIADO",
                intentos: 1,
              });
            }
            toastMsg.textContent =
              "Acuse digital registrado en la cola de notificaciones MPCH.";
          } catch {
            toastMsg.textContent =
              "Sin conexión: acuse marcado para envío diferido.";
          }
          toast.classList.add("show");
        });

      document
        .getElementById("btnNuevaFiscalizacion")
        .addEventListener("click", () => {
          sessionStorage.removeItem("mpch_active_vehicle");
          sessionStorage.removeItem("mpch_acta_pendiente");
          sessionStorage.removeItem("mpch_acta_emitida");
          sessionStorage.removeItem("mpch_offline_state");
          window.location.href = "/consulta-campo";
        });
    </script>
  </body>
</html>
